<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generador de Clave</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0d0d0f;
            --panel: #141418;
            --border: #1e2a38;
            --accent: #00c8f0;
            --accent2: #0066cc;
            --text: #e8f4ff;
            --muted: #4a6070;
            --success: #00e5a0;
            --danger: #ff4060;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,200,240,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,200,240,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 36px 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 60px rgba(0,200,240,0.06), 0 20px 60px rgba(0,0,0,0.5);
        }

        .card::before {
            content: '';
            position: absolute;
            top: -1px; left: 20px; right: 20px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            border-radius: 2px;
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            15%      { transform: translateX(-8px); }
            30%      { transform: translateX(8px); }
            45%      { transform: translateX(-6px); }
            60%      { transform: translateX(6px); }
            75%      { transform: translateX(-3px); }
            90%      { transform: translateX(3px); }
        }

        .card.shake {
            animation: shake 0.5s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header .tag {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: var(--accent);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text);
        }

        .header h1 span {
            color: var(--accent);
        }

        .input-label {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 14px;
            display: block;
        }

        /* OTP-style digit boxes */
        .digit-boxes {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .digit-box {
            width: 56px;
            height: 64px;
            background: #0a0a0c;
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Share Tech Mono', monospace;
            font-size: 30px;
            color: var(--accent);
            cursor: text;
            position: relative;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
            user-select: none;
        }

        .digit-box.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,200,240,0.15), 0 0 16px rgba(0,200,240,0.2);
        }

        .digit-box.filled {
            border-color: rgba(0,200,240,0.4);
        }

        .digit-box.error {
            border-color: var(--danger);
            box-shadow: 0 0 0 3px rgba(255,64,96,0.15);
        }

        @keyframes popIn {
            0%   { transform: scale(0.7); opacity: 0.3; }
            60%  { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }

        .digit-box.pop {
            animation: popIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
        }

        /* Cursor blink inside active box */
        .digit-box.active::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 32px;
            background: var(--accent);
            border-radius: 1px;
            animation: blink 1s step-end infinite;
            opacity: 0;
        }

        .digit-box.active.empty::after {
            opacity: 1;
        }

        @keyframes blink {
            0%,100% { opacity: 1; }
            50%      { opacity: 0; }
        }

        /* Hidden real input for keyboard */
        .hidden-input {
            position: absolute;
            opacity: 0;
            width: 1px;
            height: 1px;
            pointer-events: none;
        }

        .error-msg {
            font-size: 13px;
            color: var(--danger);
            text-align: center;
            min-height: 18px;
            margin-bottom: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Button + ripple container */
        .btn-wrap {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            position: relative;
            z-index: 1;
        }

        .btn:active { transform: scale(0.97); }

        .btn:hover {
            box-shadow: 0 0 28px rgba(0,200,240,0.35);
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.1));
        }

        /* Ripple */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        /* Particles */
        .particle {
            position: fixed;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
        }

        @keyframes particleFly {
            0%   { transform: translate(0,0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        /* Result */
        .result-section {
            margin-top: 28px;
            display: none;
        }

        .result-section.visible {
            display: block;
        }

        .result-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            margin-bottom: 20px;
        }

        .result-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--muted);
            text-align: center;
            margin-bottom: 12px;
        }

        .result-clave {
            font-family: 'Share Tech Mono', monospace;
            font-size: 52px;
            color: var(--success);
            text-align: center;
            letter-spacing: 14px;
            display: flex;
            justify-content: center;
            gap: 4px;
            padding-left: 14px; /* offset letter-spacing */
        }

        .result-digit {
            display: inline-block;
            min-width: 40px;
            text-align: center;
        }

        @keyframes slotSpin {
            0%   { transform: translateY(-80%); opacity: 0; }
            60%  { transform: translateY(10%); }
            80%  { transform: translateY(-4%); }
            100% { transform: translateY(0); opacity: 1; }
        }

        .result-digit.spin {
            animation: slotSpin 0.4s cubic-bezier(0.22,1,0.36,1) both;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px rgba(0,229,160,0.3); }
            to   { text-shadow: 0 0 28px rgba(0,229,160,0.7); }
        }

        .result-clave.done {
            animation: glow 2s ease-in-out infinite alternate;
        }

        /* Breakdown */
        .breakdown {
            margin-top: 20px;
            display: grid;
            gap: 6px;
        }

        .breakdown-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            opacity: 0;
            transform: translateX(-12px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .breakdown-row.show {
            opacity: 1;
            transform: translateX(0);
        }

        .breakdown-num {
            font-family: 'Share Tech Mono', monospace;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent2);
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .breakdown-desc {
            color: var(--muted);
            flex: 1;
            font-size: 12px;
        }

        .breakdown-val {
            font-family: 'Share Tech Mono', monospace;
            font-size: 18px;
            color: var(--success);
            font-weight: 700;
        }

        .copy-btn {
            margin-top: 16px;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .copy-btn.copied {
            border-color: var(--success);
            color: var(--success);
        }
    </style>
</head>
<body>

<div class="card" id="card">
    <div class="header">
        <div class="tag">NUM · Logic</div>
        <h1>Generador de <span>Clave</span></h1>
    </div>

    <label class="input-label">Clave inicial</label>

    <input type="tel" id="hiddenInput" class="hidden-input" maxlength="5"
           inputmode="numeric" pattern="[0-9]*" autocomplete="off">

    <div class="digit-boxes" id="digitBoxes">
        <div class="digit-box active empty" data-index="0"></div>
        <div class="digit-box" data-index="1"></div>
        <div class="digit-box" data-index="2"></div>
        <div class="digit-box" data-index="3"></div>
        <div class="digit-box" data-index="4"></div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="btn-wrap" id="btnWrap">
        <button class="btn" id="genBtn">⚡ Generar Clave</button>
    </div>

    <div class="result-section" id="resultSection">
        <div class="result-divider"></div>
        <div class="result-label">Clave Generada</div>
        <div class="result-clave" id="resultadoClave"></div>
        <div class="breakdown" id="breakdown"></div>
        <button class="copy-btn" id="copyBtn" onclick="copiarClave()">📋 Copiar Clave</button>
    </div>
</div>

<script>
    const hiddenInput = document.getElementById('hiddenInput');
    const boxes       = document.querySelectorAll('.digit-box');
    const errorMsg    = document.getElementById('errorMsg');
    const card        = document.getElementById('card');

    let digits = ['','','','',''];
    let activeIndex = 0;

    /* ── Focus management ── */
    function focusInput() {
        hiddenInput.focus({ preventScroll: true });
    }

    document.getElementById('digitBoxes').addEventListener('click', focusInput);
    document.addEventListener('DOMContentLoaded', focusInput);
    setTimeout(focusInput, 100);

    function setActive(i) {
        activeIndex = i;
        boxes.forEach((b, idx) => {
            b.classList.toggle('active', idx === i);
            b.classList.toggle('empty', idx === i && digits[idx] === '');
        });
    }

    /* ── Input handling ── */
    hiddenInput.addEventListener('keydown', e => {
        clearError();

        if (e.key === 'Backspace') {
            e.preventDefault();
            if (digits[activeIndex] !== '') {
                digits[activeIndex] = '';
                renderBox(activeIndex);
            } else if (activeIndex > 0) {
                activeIndex--;
                digits[activeIndex] = '';
                renderBox(activeIndex);
                setActive(activeIndex);
            }
            hideResult();
            return;
        }

        if (e.key === 'Enter') {
            generarClave();
            return;
        }

        if (/^\d$/.test(e.key)) {
            e.preventDefault();
            if (activeIndex < 5) {
                digits[activeIndex] = e.key;
                renderBox(activeIndex, true);
                if (activeIndex < 4) {
                    activeIndex++;
                    setActive(activeIndex);
                } else {
                    /* All filled — deactivate cursor but keep box highlighted */
                    boxes.forEach(b => {
                        b.classList.remove('active','empty');
                        b.classList.add('filled');
                    });
                    activeIndex = 5;
                }
                hideResult();
            }
        }
    });

    /* Also handle paste */
    hiddenInput.addEventListener('paste', e => {
        e.preventDefault();
        const pasted = (e.clipboardData || window.clipboardData)
            .getData('text').replace(/\D/g,'').slice(0,5);
        pasted.split('').forEach((ch, i) => {
            digits[i] = ch;
            renderBox(i, true);
        });
        const next = Math.min(pasted.length, 4);
        if (pasted.length >= 5) {
            boxes.forEach(b => { b.classList.remove('active','empty'); b.classList.add('filled'); });
            activeIndex = 5;
        } else {
            setActive(next);
        }
        hideResult();
    });

    function renderBox(i, animate) {
        const box = boxes[i];
        box.textContent = digits[i];
        box.classList.toggle('filled', digits[i] !== '');
        box.classList.toggle('empty', digits[i] === '');
        if (animate && digits[i] !== '') {
            box.classList.remove('pop');
            void box.offsetWidth;
            box.classList.add('pop');
        }
    }

    /* ── Ripple ── */
    document.getElementById('genBtn').addEventListener('click', e => {
        const btn  = e.currentTarget;
        const rect = btn.getBoundingClientRect();
        const rip  = document.createElement('span');
        rip.className = 'ripple';
        const size = Math.max(rect.width, rect.height);
        rip.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
        btn.appendChild(rip);
        rip.addEventListener('animationend', () => rip.remove());
        generarClave();
    });

    /* ── Particles ── */
    function spawnParticles(x, y) {
        const colors = ['#00c8f0','#00e5a0','#0066cc','#ffffff','#7df9ff'];
        for (let i = 0; i < 22; i++) {
            const p   = document.createElement('div');
            p.className = 'particle';
            const angle = Math.random() * Math.PI * 2;
            const dist  = 60 + Math.random() * 100;
            const dx    = Math.cos(angle) * dist;
            const dy    = Math.sin(angle) * dist;
            p.style.cssText = `
                left:${x}px; top:${y}px;
                background:${colors[Math.floor(Math.random()*colors.length)]};
                --dx:${dx}px; --dy:${dy}px;
                animation: particleFly ${0.5+Math.random()*0.4}s ease-out forwards;
            `;
            document.body.appendChild(p);
            p.addEventListener('animationend', () => p.remove());
        }
    }

    /* ── Main logic ── */
    function generarClave() {
        const value = digits.join('');

        if (value.length !== 5 || !/^\d{5}$/.test(value)) {
            boxes.forEach(b => b.classList.add('error'));
            setTimeout(() => boxes.forEach(b => b.classList.remove('error')), 600);
            errorMsg.textContent = 'Ingresa exactamente 5 dígitos numéricos.';
            card.classList.remove('shake');
            void card.offsetWidth;
            card.classList.add('shake');
            card.addEventListener('animationend', () => card.classList.remove('shake'), { once: true });
            return;
        }

        /* Particles from button center */
        const btnRect = document.getElementById('genBtn').getBoundingClientRect();
        spawnParticles(btnRect.left + btnRect.width/2, btnRect.top + btnRect.height/2);

        const c = value.split('').map(Number);

        const d1 = c[4];
        const d2 = Math.abs(c[1] - c[2]);
        const d3 = Math.abs((2 * c[3]) - c[1]) % 10;
        const suma45   = c[3] + c[4];
        const producto = suma45 * c[1] + suma45 * c[2];
        const d4 = Math.floor(producto / 10) % 10;
        const d5 = (c[0]+c[1]+c[2]+c[3]+c[4]) % 10;

        const resultDigits = [d1, d2, d3, d4, d5];

        /* Show section first */
        const resultSection = document.getElementById('resultSection');
        resultSection.style.display = 'block';

        /* Slot machine result */
        const claveEl = document.getElementById('resultadoClave');
        claveEl.classList.remove('done');
        claveEl.innerHTML = resultDigits.map((d, i) =>
            `<span class="result-digit" id="rd${i}">?</span>`
        ).join('');

        resultDigits.forEach((d, i) => {
            const span = document.getElementById(`rd${i}`);
            let ticks = 0;
            const maxTicks = 8 + i * 3;
            const interval = setInterval(() => {
                span.textContent = Math.floor(Math.random() * 10);
                ticks++;
                if (ticks >= maxTicks) {
                    clearInterval(interval);
                    span.textContent = d;
                    span.classList.add('spin');
                    if (i === 4) {
                        setTimeout(() => claveEl.classList.add('done'), 300);
                    }
                }
            }, 50);
        });

        /* Breakdown with stagger */
        const descriptions = [
            { n: 1, desc: `5° dígito de la clave (${c[4]})`, val: d1 },
            { n: 2, desc: `|${c[1]} − ${c[2]}|`, val: d2 },
            { n: 3, desc: `Unidad de |2×${c[3]} − ${c[1]}| = ${Math.abs(2*c[3]-c[1])}`, val: d3 },
            { n: 4, desc: `Decena de (${suma45}×${c[1]} + ${suma45}×${c[2]}) = ${producto}`, val: d4 },
            { n: 5, desc: `Unidad de (${c.join('+')} = ${c.reduce((a,b)=>a+b,0)})`, val: d5 },
        ];

        const bdEl = document.getElementById('breakdown');
        bdEl.innerHTML = descriptions.map(r => `
            <div class="breakdown-row">
                <span class="breakdown-num">${r.n}</span>
                <span class="breakdown-desc">${r.desc}</span>
                <span class="breakdown-val">${r.val}</span>
            </div>
        `).join('');

        const rows = bdEl.querySelectorAll('.breakdown-row');
        rows.forEach((row, i) => {
            setTimeout(() => row.classList.add('show'), 400 + i * 100);
        });

        document.getElementById('copyBtn').textContent = '📋 Copiar Clave';
        document.getElementById('copyBtn').classList.remove('copied');
    }

    function clearError() {
        errorMsg.textContent = '';
        boxes.forEach(b => b.classList.remove('error'));
    }

    function hideResult() {
        const rs = document.getElementById('resultSection');
        rs.style.display = 'none';
    }

    function copiarClave() {
        const digits = Array.from(document.querySelectorAll('.result-digit'))
            .map(s => s.textContent).join('');
        if (!digits || digits.includes('?')) return;
        navigator.clipboard.writeText(digits).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.textContent = '✅ Copiada!';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.textContent = '📋 Copiar Clave';
                btn.classList.remove('copied');
            }, 2000);
        });
    }
</script>
</body>
</html>
